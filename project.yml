name: Chronik
packages:
  Swinject:
    url: https://github.com/Swinject/Swinject.git
    from: 2.9.1
  Generic:
    path: Packages/Generic
  Entries:
    path: Packages/Entries
  SupabaseCore:
    path: Packages/SupabaseCore
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.3"
  minimumXcodeGenVersion: "2.38"

targets:
  Chronik:
    type: application
    platform: iOS
    sources:
      - path: Chronik/Sources/App
      - path: Chronik/Resources
    resources:
      - path: Chronik/Resources
    # Supabase credentials. Supabase.xcconfig is tracked and blank; it optionally
    # includes the gitignored Supabase.local.xcconfig holding the real values.
    configFiles:
      Debug: Chronik/Config/Supabase.xcconfig
      Release: Chronik/Config/Supabase.xcconfig
    # A shared scheme, so `xcodebuild -scheme Chronik` keeps working after
    # `xcodegen generate`. Without this the scheme is autocreated into xcuserdata
    # and wiped on every regeneration.
    scheme:
      testTargets:
        - ChronikTests
    # A real Info.plist template, not INFOPLIST_KEY_* settings: that prefix only
    # supports Xcode's documented key allowlist and silently drops custom keys.
    # GENERATE_INFOPLIST_FILE still fills in everything else.
    info:
      path: Chronik/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    dependencies:
      - package: Generic
      - package: Entries
      - package: SupabaseCore
      - package: Swinject
    settings:
      base:
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Chronik

  # The macOS app. Same sources, same composition root and the same bundle
  # identifier as the iOS app — only the platform-specific build settings and
  # the sandbox entitlements differ.
  ChronikMac:
    type: application
    platform: macOS
    sources:
      - path: Chronik/Sources/App
      - path: Chronik/Resources
    resources:
      - path: Chronik/Resources
    configFiles:
      Debug: Chronik/Config/Supabase.xcconfig
      Release: Chronik/Config/Supabase.xcconfig
    scheme: {}
    # Shares the iOS target's Info.plist: every key in it is platform-neutral,
    # and both targets generate identical content.
    info:
      path: Chronik/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    # A sandboxed Mac app reaches Supabase only with the network-client
    # entitlement; without it every request fails at the socket.
    entitlements:
      path: Chronik/Chronik.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    dependencies:
      - package: Generic
      - package: Entries
      - package: SupabaseCore
      - package: Swinject
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_NAME: Chronik
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Chronik

  ChronikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Chronik/Tests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Chronik
      - package: Generic
      - package: Entries
      - package: SupabaseCore
