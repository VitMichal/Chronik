name: Chronik
packages:
  Swinject:
    url: https://github.com/Swinject/Swinject.git
    from: 2.9.1
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38"

targets:
  Chronik:
    type: application
    platform: iOS
    sources:
      - path: Chronik/Sources/App
      - path: Chronik/Resources
    resources:
      - path: Chronik/Resources
    dependencies:
      - target: Generic
      - target: Entries
      - package: Swinject
    settings:
      base:
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Chronik

  ChronikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Chronik/Tests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Chronik
      - target: Generic
      - target: Entries

  Generic:
    type: framework
    platform: iOS
    sources:
      - path: Chronik/Sources/Generic
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Generic
        DEFINES_MODULE: YES

  Entries:
    type: framework
    platform: iOS
    sources:
      - path: Chronik/Sources/Features/Entries
      - path: Chronik/Sources/Features/Entries/DI
    dependencies:
      - target: Generic
      - package: Swinject
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Entries
        DEFINES_MODULE: YES
